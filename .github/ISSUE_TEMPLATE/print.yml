name: Print a page
description: Give a public page's address; Weblitz's PDF and Chrome's come back side by side in a few minutes.
title: "Print: "
labels: ["print"]
body:
  - type: markdown
    attributes:
      value: |
        The showcase prints the page with Weblitz and with Chrome 156 on GitHub's own runners, and answers here with both
        PDFs and their first pages side by side. If they differ, say what you see: that is a bug, and the next beta fixes
        it. Public pages only. Weblitz's PDF carries a trial watermark (the showcase runs without a licence).
  - type: input
    id: url
    attributes:
      label: Page address
      placeholder: https://example.com
    validations:
      required: true
  - type: dropdown
    id: paper
    attributes:
      label: Paper
      options: [A4, Letter, Legal, A3]
      default: 0
  - type: checkboxes
    id: orientation
    attributes:
      label: Orientation
      options:
        - label: Landscape
