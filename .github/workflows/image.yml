name: Container image

# Builds the API's image for x64 and ARM64 and publishes it as ghcr.io/<this repository>, then starts it and prints a
# page through it.
on:
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=raw,value=latest
          type=sha,prefix=
    - uses: docker/build-push-action@v6
      with:
        context: src
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: The published image prints a page
      run: |
        docker run -d --name api -p 8080:8080 ghcr.io/${{ github.repository }}:latest
        for i in $(seq 1 60); do curl -fs http://localhost:8080/health && break; sleep 2; done
        curl -fsS -o page.pdf -D headers.txt "http://localhost:8080/pdf?url=https://example.com"
        head -c 5 page.pdf | grep -q '%PDF-'
        grep -i '^x-weblitz' headers.txt
        # (public pages only)
        test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8080/pdf?url=http://169.254.169.254/')" = 400
        docker logs api | tail -5
